# railway.toml — KidAI admin dashboard configuration
# Plan 15-04: Config-as-code for reset cron services
# See: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"


[[deploy.crons]]
name = "daily-reset"
schedule = "0 0 * * *"
command = "sh -c \"curl --retry 5 --retry-delay 10 --retry-all-errors -fsS -X POST -H 'x-cron-secret: $CRON_SECRET' https://kidschat-admin-production.up.railway.app/api/cron/daily-reset\""

[[deploy.crons]]
name = "monthly-reset"
schedule = "0 0 1 * *"
command = "sh -c \"curl --retry 5 --retry-delay 10 --retry-all-errors -fsS -X POST -H 'x-cron-secret: $CRON_SECRET' https://kidschat-admin-production.up.railway.app/api/cron/monthly-reset\""

[[deploy.crons]]
name = "daily-notifications"
schedule = "0 8 * * *"
command = "sh -c \"curl --retry 5 --retry-delay 10 --retry-all-errors -fsS -X POST -H 'x-cron-secret: $CRON_SECRET' https://kidschat-admin-production.up.railway.app/api/notify/daily-summary && curl --retry 5 --retry-delay 10 --retry-all-errors -fsS -X POST -H 'x-cron-secret: $CRON_SECRET' https://kidschat-admin-production.up.railway.app/api/notify/weekly-digest\""
