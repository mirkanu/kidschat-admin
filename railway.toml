# railway.toml — KidAI admin dashboard configuration
# Plan 15-04: Config-as-code for reset cron services
# See: https://docs.railway.app/reference/config-as-code
#
# NOTE: These cron services are NOT git-linked to this repo.
# Changes here are documentation only — apply live via Railway GraphQL
# serviceInstanceUpdate (service IDs in .planning/quick/260417-afs/).

[build]
builder = "NIXPACKS"


[[deploy.crons]]
name = "daily-reset"
schedule = "0 0 * * *"
command = "sh -c \"curl --retry 5 --retry-delay 15 --retry-all-errors -sS -X POST -H 'x-cron-secret: $CRON_SECRET' ${APP_URL}/api/cron/daily-reset || echo CURL_FAILED\""

[[deploy.crons]]
name = "monthly-reset"
schedule = "0 0 1 * *"
command = "sh -c \"curl --retry 5 --retry-delay 15 --retry-all-errors -sS -X POST -H 'x-cron-secret: $CRON_SECRET' ${APP_URL}/api/cron/monthly-reset || echo CURL_FAILED\""

[[deploy.crons]]
name = "daily-notifications"
schedule = "0 8 * * *"
command = "sh -c \"curl --retry 5 --retry-delay 15 --retry-all-errors -sS -X POST -H 'x-cron-secret: $CRON_SECRET' ${APP_URL}/api/notify/daily-summary && curl --retry 5 --retry-delay 15 --retry-all-errors -sS -X POST -H 'x-cron-secret: $CRON_SECRET' ${APP_URL}/api/notify/weekly-digest || echo CURL_FAILED\""
